name: Weather Notifier

on:
  schedule:
    - cron: "0 0 * * *"   # Runs at midnight UTC = 6 AM Bangladesh time
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create config
        env:
          EMAIL: ${{ secrets.WEATHER_NOTIFIER_EMAIL }}
          RECEIVER: ${{ secrets.WEATHER_NOTIFIER_RECEIVER }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          LATITUDE: ${{ secrets.LATITUDE }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
        run: |
          python - <<'PY'
          import json, os
          config = {
              "email": {
                  "sender": os.environ["EMAIL"],
                  "receiver": os.environ["RECEIVER"],
                  "sender_name": "Weather Notifier",
                  "smtp_server": "smtp.gmail.com",
                  "smtp_port": 587
              },
              "weather": {
                  "api_key": os.environ["WEATHER_API_KEY"],
                  "latitude": float(os.environ["LATITUDE"]),
                  "longitude": float(os.environ["LONGITUDE"])
              },
              "forecast_count": 14,
              "min_pop": 0.3,
              "scheduling": {
                  "daily_time": "06:00",
                  "timezone": os.environ.get("TIMEZONE", "Asia/Dhaka")
              }
          }
          with open("config.json", "w") as f:
              json.dump(config, f, indent=4)
          PY

      - name: Run weather notifier
        env:
          WEATHER_NOTIFIER_SMTP_PASSWORD: ${{ secrets.WEATHER_NOTIFIER_SMTP_PASSWORD }}
        run: python weather_notifier.py --once

      - name: Upload logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: weather-notifier-logs
          path: weather_notifier.log
